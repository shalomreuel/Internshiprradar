name: Daily internship discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *" # 08:00 IST (GitHub Actions uses UTC)

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python main.py
      - name: Commit latest results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/opportunities.csv data/daily_digest.md
          git diff --cached --quiet || git commit -m "Update daily internship opportunities"
          git push
